name: Bug report
description: Report a reproducible behavior problem without personal data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach passwords, private keys, personal documents or full system logs. Security reports belong in a private channel, not this issue."
  - type: input
    id: version
    attributes:
      label: App version and macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: dropdown
    id: power
    attributes:
      label: Power source
      options:
        - Battery
        - Power adapter
        - Unknown
